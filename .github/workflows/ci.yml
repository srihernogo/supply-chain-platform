name: Supply Chain Platform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/supply-chain

jobs:
  # ─────────────────────────────────────────────────
  # Build & Test All Modules
  # ─────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supplychain_test
          POSTGRES_USER: scuser
          POSTGRES_PASSWORD: scpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build Common Module
        run: mvn -B install -pl common -am -DskipTests

      - name: Run Tests — Supplier Service
        run: mvn -B test -pl supplier-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/supplychain_test
          SPRING_DATASOURCE_USERNAME: scuser
          SPRING_DATASOURCE_PASSWORD: scpassword

      - name: Run Tests — Inventory Service
        run: mvn -B test -pl inventory-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/supplychain_test
          SPRING_DATASOURCE_USERNAME: scuser
          SPRING_DATASOURCE_PASSWORD: scpassword

      - name: Run Tests — Blockchain Ledger Service
        run: mvn -B test -pl blockchain-ledger-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/supplychain_test
          SPRING_DATASOURCE_USERNAME: scuser
          SPRING_DATASOURCE_PASSWORD: scpassword

      - name: Run Tests — API Gateway
        run: mvn -B test -pl api-gateway

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.xml'

  # ─────────────────────────────────────────────────
  # Code Quality
  # ─────────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      - name: Build without tests
        run: mvn -B package -DskipTests
      - name: Check code style
        run: mvn -B checkstyle:check || true

  # ─────────────────────────────────────────────────
  # Docker Build & Push (main branch only)
  # ─────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [api-gateway, supplier-service, inventory-service, blockchain-ledger-service]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build JAR for ${{ matrix.service }}
        run: mvn -B package -pl common,${{ matrix.service }} -am -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────────
  # Deploy to ECS (requires AWS secrets configured)
  # ─────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to ECS
        run: |
          echo "Deploying supply-chain services to ECS..."
          # aws ecs update-service --cluster supply-chain-cluster --service api-gateway --force-new-deployment
          # aws ecs update-service --cluster supply-chain-cluster --service supplier-service --force-new-deployment
          # aws ecs update-service --cluster supply-chain-cluster --service inventory-service --force-new-deployment
          # aws ecs update-service --cluster supply-chain-cluster --service blockchain-ledger-service --force-new-deployment
          echo "Deployment triggered."
