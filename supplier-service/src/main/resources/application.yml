server:
  port: 8081

spring:
  application:
    name: supplier-service

  datasource:
    url: jdbc:postgresql://localhost:5432/supplychain
    username: scuser
    password: scpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: toyota  # overridden by routing datasource per-request

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Multi-tenant: Flyway runs migrations for each schema separately
    # See FlywayTenantMigration.java for the multi-schema migration runner

jwt:
  secret: ${JWT_SECRET:supply-chain-jwt-secret-key-must-be-at-least-32-chars}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.supplychain: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:supplychain}
    username: ${DB_USER:scuser}
    password: ${DB_PASSWORD:scpassword}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans
